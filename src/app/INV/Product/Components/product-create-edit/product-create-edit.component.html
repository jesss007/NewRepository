<p-overlay [visible]="isActive" (onHide)="onCancel()">
  <div class="modal">

    <h2>{{productData? 'Update Product' : 'Create Product' }} </h2>
    <ng-container *ngIf="!productData">
      <label>Name</label>
      <input [(ngModel)]="product.name" placeholder="Enter Name">

      <label>SKU</label>
      <input [(ngModel)]="product.sku" placeholder="Enter SKU">

      <label>Product Code</label>
      <input [(ngModel)]="product.productCode" placeholder="Auto-Generated" [disabled]="true">

      <label>Category</label>
      <select [(ngModel)]="product.category" > 
        <option value="" disabled> Select Category </option>
        <option value="Electronics"> Electronics </option>
        <option value="Accessories"> Accessories </option>
        <option value="Audio"> Audio </option>
      </select>

      <label>Status</label>
      <select [(ngModel)]="product.status">
        <option [ngValue]="1">For Sale</option>
        <option [ngValue]="2">Not for sale</option>
        <option [ngValue]="3">On Hold</option>
      </select>
    </ng-container>

    <ng-container *ngIf="productData">
      <label> Name </label>
      <input [(ngModel)]="product.name" type="text">

      <label> SKU </label>
      <input [(ngModel)]="product.sku" type="text">
      <label> Status </label>
      <select [(ngModel)]="product.status">
        <option [ngValue]="1">For Sale</option>
        <option [ngValue]="2">Not for Sale</option>
        <option [ngValue]="3">On Hold</option>
      </select>
    </ng-container>

    <button (click)="onSubmit()">Submit</button>
    <button (click)="onCancel()">Cancel</button>

  </div>
</p-overlay>
