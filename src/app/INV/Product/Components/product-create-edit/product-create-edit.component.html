<p-overlay [visible]="isActive" (onHide)="onCancel()">
  <div class="modal">

    <h2>{{productData? 'Update Product' : 'Create Product' }} </h2>
    <ng-container *ngIf="!productData">
      <label>Name</label>
      <input [(ngModel)]="product.name" placeholder="Enter Name">

      <label>Description</label>
      <input [(ngModel)]="product.description" placeholder="Enter Description">

      <label>Product Code</label>
      <input [(ngModel)]="product.productCode" placeholder="Enter Product Code">

      <label>Price Per Unit</label>
      <input [(ngModel)]="product.pricePerUnit" type="number" placeholder="Enter Price">

      <label>Stocks</label>
      <input [(ngModel)]="product.quantity" type="number" placeholder="Enter Quantity">

      <label>Status</label>
      <select [(ngModel)]="product.status">
        <option [ngValue]="1">In Stock</option>
        <option [ngValue]="2">Out of Stock</option>
        <option [ngValue]="3">Discontinued</option>
      </select>
    </ng-container>

    <ng-container *ngIf="productData">
      <label> Price </label>
      <input [(ngModel)]="product.pricePerUnit" type="number">

      <label>Stocks</label>
      <input [(ngModel)]="product.quantity" type="number">

      <label> Status </label>
      <select [(ngModel)]="product.status">
        <option [ngValue]="1">In Stock</option>
        <option [ngValue]="2"> Out of stock</option>
        <option [ngValue]="3">Discontinued</option>
      </select>
    </ng-container>

    <button (click)="onSubmit()">Submit</button>
    <button (click)="onCancel()">Cancel</button>

  </div>
</p-overlay>
